{{ template "page/head_start" .}}
<style>
    .dark .ant-statistic-content {
        color: var(--dark-color-text-primary);
    }
    .dark .ant-statistic-title {
        color: rgba(255, 255, 255, 0.55);
    }
    .stats-bar-container {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .stats-bar {
        height: 20px;
        border-radius: 4px;
        transition: width 0.5s ease;
        min-width: 2px;
    }
    .stats-chart-row {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
        gap: 8px;
    }
    .stats-chart-label {
        width: 160px;
        text-align: right;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .stats-chart-bar-wrap {
        flex: 1;
        height: 22px;
        background: rgba(0,0,0,0.04);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
    }
    .dark .stats-chart-bar-wrap {
        background: rgba(255,255,255,0.06);
    }
    .stats-chart-bar {
        height: 100%;
        border-radius: 4px;
        transition: width 0.6s ease;
        display: flex;
        align-items: center;
        padding-left: 6px;
        font-size: 11px;
        color: #fff;
        white-space: nowrap;
    }
    .stats-chart-value {
        width: 100px;
        text-align: left;
        font-size: 12px;
        flex-shrink: 0;
    }
    .online-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
    }
    .online-dot.online { background: #52c41a; }
    .online-dot.offline { background: #d9d9d9; }
    .bw-cell {
        font-family: monospace;
        font-size: 12px;
    }
    .ip-tag {
        font-size: 11px;
        margin: 1px 2px;
        cursor: pointer;
    }
    .statistics-table .ant-table-thead > tr > th,
    .statistics-table .ant-table-tbody > tr > td {
        white-space: nowrap;
    }
    .statistics-email {
        display: inline-block;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: bottom;
        white-space: nowrap;
    }
    .ip-popover {
        min-width: 220px;
        max-width: 280px;
    }
    .ip-popover-row {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
    }
    .ip-popover-row strong {
        min-width: 78px;
    }
    .ip-popover-note {
        color: #999;
    }
</style>

<a-layout id="app" v-cloak :class="themeSwitcher.currentTheme + ' statistics-page'">
    <a-sidebar></a-sidebar>
    <a-layout id="content-layout">
        <a-layout-content>
            <a-spin :spinning="loading" :delay="200" tip='{{ i18n "loading" }}'>
                <transition name="list" appear>
                    <template>
                        <a-row v-if="!fetched">
                            <a-card class="card-placeholder text-center">
                                <a-spin tip='{{ i18n "loading" }}'></a-spin>
                            </a-card>
                        </a-row>
                        <a-row :gutter="[16, 12]" v-else>
                            <!-- Summary Cards -->
                            <a-col :span="24">

                                    <a-row :gutter="16">
                                        <a-col :sm="12" :md="6">
                                            <a-statistic :title="'{{ i18n "pages.statistics.totalClients" }}'"
                                                :value="stats.length" />
                                        </a-col>
                                        <a-col :sm="12" :md="6">
                                            <a-statistic :title="'{{ i18n "pages.statistics.onlineClients" }}'"
                                                :value="onlineCount"
                                                :value-style="{ color: '#3f8600' }" />
                                        </a-col>
                                        <a-col :sm="12" :md="6">
                                            <a-statistic :title="'{{ i18n "pages.statistics.totalBandwidth" }}'"
                                                :value="totalBandwidthFormatted" />
                                        </a-col>
                                        <a-col :sm="12" :md="6">
                                            <a-statistic :title="'{{ i18n "pages.statistics.avgUptime" }}'"
                                                :value="avgUptimeFormatted" />
                                        </a-col>
                                    </a-row>
                                </a-card>
                            </a-col>

                            <!-- Actions Bar -->
                            <a-col :span="24">
                                <a-card hoverable size="small">
                                    <a-row type="flex" align="middle" :gutter="12">

                                            <a-input-search

                                        </a-col>
                                        <a-col>
                                            <div style="display: flex; align-items: center; gap: 8px;">
                                                <a-select v-model="statsAutoDeleteHours" style="width: 180px;">
                                                    <a-select-option
                                                        v-for="option in statsAutoDeleteOptions"
                                                        :key="option.value"
                                                        :value="option.value">
                                                        [[ option.label ]]
                                                    </a-select-option>
                                                </a-select>
                                                <a-button
                                                    icon="clock-circle"
                                                    :loading="statsAutoDeleteSaving"

                                                </a-button>
                                            </div>
                                            <div v-if="statsAutoDeleteLastRun > 0" style="font-size: 12px; color: #999; margin-top: 4px;">

                                        </a-col>

                                            <a-button type="primary" icon="reload" @click="fetchStats">

                                        </a-col>
                                        <a-col>
                                            <a-popconfirm

                                                </a-button>
                                            </a-popconfirm>
                                        </a-col>
                                    </a-row>
                                </a-card>
                            </a-col>

                            <!-- Tabs -->

                                                                                <strong>ISP</strong>

                                                                            </div>
                                                                            <div class="ip-popover-row">
                                                                                <strong>Org</strong>
                                                                                <span>[[ ipInfo(ipEntry.ip).organization || '-' ]]</span>
                                                                            </div>
                                                                            <div class="ip-popover-row">
                                                                                <strong>Location</strong>
                                                                                <span>[[ formatIpLocation(ipInfo(ipEntry.ip)) || '-' ]]</span>
                                                                            </div>
                                                                            <div class="ip-popover-row">
                                                                                <strong>Timezone</strong>
                                                                                <span>[[ ipInfo(ipEntry.ip).timezone || '-' ]]</span>
                                                                            </div>

                                                                    </template>

                                                                <a-tag class="ip-tag">[[ ipEntry.ip ]]</a-tag>

<script>
    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            loading: false,
            fetched: false,
            searchText: '',
            ipInfoCache: {},
            ipInfoLoading: {},
            statsAutoDeleteHours: 0,
            statsAutoDeleteLastRun: 0,
            statsAutoDeleteSaving: false,
            statsAutoDeleteOptions: [
                { value: 0, label: 'Auto Delete Off' },
                { value: 24, label: 'Daily (1 day)' },
                { value: 48, label: 'Every 2 days' },
                { value: 72, label: 'Every 3 days' },
                { value: 168, label: 'Weekly (7 days)' },
            ],
            stats: [],
            refreshIntervalId: null,
            trafficListener: null,
            connectListener: null,
            columns: [
                {
                    title: '{{ i18n "pages.statistics.colStatus" }}',
                    key: 'status',
                    width: 90,
                    scopedSlots: { customRender: 'status' },
                    sorter: (a, b) => (a.isOnline === b.isOnline ? 0 : a.isOnline ? -1 : 1),
                    defaultSortOrder: 'ascend',
                },
                {
                    title: '{{ i18n "pages.statistics.colEmail" }}',
                    key: 'email',
                    width: 280,
                    scopedSlots: { customRender: 'email' },
                    sorter: (a, b) => a.email.localeCompare(b.email),
                },
                {
                    title: '{{ i18n "pages.statistics.colUptime" }}',
                    key: 'uptime',
                    width: 130,
                    scopedSlots: { customRender: 'uptime' },
                    sorter: (a, b) => a.totalUptime - b.totalUptime,
                },
                {
                    title: '{{ i18n "pages.statistics.colTotalUsage" }}',
                    key: 'totalUsage',
                    width: 120,
                    scopedSlots: { customRender: 'totalUsage' },
                    sorter: (a, b) => a.allTimeUsage - b.allTimeUsage,
                },
                {
                    title: '{{ i18n "pages.statistics.colLastOnline" }}',
                    key: 'lastOnline',
                    width: 140,
                    scopedSlots: { customRender: 'lastOnline' },
                    sorter: (a, b) => a.lastOnline - b.lastOnline,
                },
                {
                    title: '{{ i18n "pages.statistics.colIPs" }}',
                    key: 'ips',
                    width: 200,
                    scopedSlots: { customRender: 'ips' },
                },
            ],
            onlineBwColumns: [
                {
                    title: '{{ i18n "pages.statistics.colEmail" }}',
                    key: 'onlineEmail',
                    width: 280,
                    scopedSlots: { customRender: 'onlineEmail' },
                },
                {
                    title: '{{ i18n "pages.statistics.colTotalBw" }}',
                    key: 'bwTotal',
                    width: 150,
                    scopedSlots: { customRender: 'bwTotal' },
                    sorter: (a, b) => (a.currentBwUp + a.currentBwDown) - (b.currentBwUp + b.currentBwDown),
                },
                {
                    title: '{{ i18n "pages.statistics.colIPs" }}',
                    key: 'onlineIps',
                    width: 220,
                    scopedSlots: { customRender: 'onlineIps' },
                },
            ],
        },
        computed: {
            filteredStats() {
                if (!this.searchText) return this.stats;
                const s = this.searchText.toLowerCase();
                return this.stats.filter(r =>
                    r.email.toLowerCase().includes(s) ||
                    (r.ips && r.ips.some(ip => ip.ip.includes(s)))
                );
            },
            onlineCount() {
                return this.stats.filter(r => r.isOnline).length;
            },
            onlineStats() {
                return this.stats.filter(r => r.isOnline).sort((a, b) =>
                    (b.currentBwUp + b.currentBwDown) - (a.currentBwUp + a.currentBwDown));
            },
            totalBandwidthFormatted() {
                const total = this.stats.reduce((sum, r) => sum + r.allTimeUsage, 0);
                return this.sizeFormat(total);
            },
            avgUptimeFormatted() {
                if (this.stats.length === 0) return '0s';
                const avg = this.stats.reduce((sum, r) => sum + r.totalUptime, 0) / this.stats.length;
                return this.formatDuration(Math.floor(avg));
            },
            uptimeChartData() {
                const sorted = [...this.stats]
                    .filter(r => r.totalUptime > 0)
                    .sort((a, b) => b.totalUptime - a.totalUptime)
                    .slice(0, 30);
                if (sorted.length === 0) return [];
                const max = sorted[0].totalUptime;
                const colors = ['#1890ff', '#13c2c2', '#52c41a', '#faad14', '#f5222d', '#722ed1', '#eb2f96'];
                return sorted.map((r, i) => ({
                    email: r.email,
                    uptime: r.totalUptime,
                    percent: max > 0 ? Math.max((r.totalUptime / max) * 100, 1) : 0,
                    color: colors[i % colors.length],
                }));
            },
            bandwidthChartData() {
                const sorted = [...this.stats]
                    .filter(r => r.allTimeUsage > 0)
                    .sort((a, b) => b.allTimeUsage - a.allTimeUsage)
                    .slice(0, 30);
                if (sorted.length === 0) return [];
                const max = sorted[0].allTimeUsage;
                const colors = ['#f5222d', '#fa541c', '#fa8c16', '#faad14', '#52c41a', '#1890ff', '#722ed1'];
                return sorted.map((r, i) => ({
                    email: r.email,
                    usage: r.allTimeUsage,
                    percent: max > 0 ? Math.max((r.allTimeUsage / max) * 100, 1) : 0,
                    color: colors[i % colors.length],
                }));
            },
        },
        methods: {
            sizeFormat(bytes) {
                if (bytes === 0 || bytes === undefined) return '0 B';
                const units = ['B', 'KB', 'MB', 'GB', 'TB'];
                let i = 0;
                let size = bytes;
                while (size >= 1024 && i < units.length - 1) {
                    size /= 1024;
                    i++;
                }
                return size.toFixed(i > 0 ? 2 : 0) + ' ' + units[i];
            },
            formatDuration(seconds) {
                if (!seconds || seconds <= 0) return '0s';
                const d = Math.floor(seconds / 86400);
                const h = Math.floor((seconds % 86400) / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                let parts = [];
                if (d > 0) parts.push(d + 'd');
                if (h > 0) parts.push(h + 'h');
                if (m > 0) parts.push(m + 'm');
                if (s > 0 && d === 0) parts.push(s + 's');
                return parts.join(' ') || '0s';
            },
            ipInfo(ip) {
                return this.ipInfoCache[ip] || {};
            },
            formatIpLocation(info) {
                if (!info) return '';
                return [info.city, info.region, info.country].filter(Boolean).join(', ');
            },
            formatIpLastSeen(lastSeen) {
                if (!lastSeen || lastSeen <= 0) return '{{ i18n "pages.statistics.never" }}';
                return moment(lastSeen).fromNow();
            },
            async loadIpInfo(ip) {
                if (!ip || this.ipInfoCache[ip] || this.ipInfoLoading[ip]) {
                    return;
                }

                this.$set(this.ipInfoLoading, ip, true);
                try {
                    const res = await axios.get('panel/api/statistics/ipInfo', {
                        params: { ip },
                    });
                    if (res.data.success) {
                        this.$set(this.ipInfoCache, ip, res.data.obj || { ip, message: 'IP information unavailable' });
                    } else {
                        this.$set(this.ipInfoCache, ip, { ip, message: res.data.msg || 'IP information unavailable' });
                    }
                } catch (e) {
                    this.$set(this.ipInfoCache, ip, { ip, message: 'IP information unavailable' });
                } finally {
                    this.$delete(this.ipInfoLoading, ip);
                }
            },
            async fetchAutoDeleteConfig() {
                try {
                    const res = await axios.get('panel/api/statistics/autoDeleteConfig');
                    if (res.data.success) {
                        const obj = res.data.obj || {};
                        this.statsAutoDeleteHours = Number(obj.hours) || 0;
                        this.statsAutoDeleteLastRun = Number(obj.lastRun) || 0;
                    } else {
                        this.$message.error(res.data.msg || 'Failed to load auto delete settings');
                    }
                } catch (e) {
                    this.$message.error('Failed to load auto delete settings');
                }
            },
            async saveAutoDeleteConfig() {
                this.statsAutoDeleteSaving = true;
                try {
                    const res = await axios.post('panel/api/statistics/autoDeleteConfig', {
                        hours: this.statsAutoDeleteHours,
                    });
                    if (res.data.success) {
                        const obj = res.data.obj || {};
                        this.statsAutoDeleteHours = Number(obj.hours) || 0;
                        this.statsAutoDeleteLastRun = Number(obj.lastRun) || 0;
                        this.$message.success('Auto delete settings saved');
                    } else {
                        this.$message.error(res.data.msg || 'Failed to save auto delete settings');
                    }
                } catch (e) {
                    this.$message.error('Failed to save auto delete settings');
                } finally {
                    this.statsAutoDeleteSaving = false;
                }
            },
            onIpPopoverVisibleChange(ip, visible) {
                if (visible) {
                    this.loadIpInfo(ip);
                }
            },
            async fetchStats() {
                this.loading = true;
                try {
                    const res = await axios.get('panel/api/statistics/stats');
                    if (res.data.success) {
                        this.stats = res.data.obj || [];
                    } else {
                        this.$message.error(res.data.msg || 'Failed to load statistics');
                    }
                } catch (e) {
                    this.$message.error('Failed to load statistics');
                } finally {
                    this.loading = false;
                    this.fetched = true;
                }
            },
            async deleteStats() {
                this.loading = true;
                try {
                    const res = await axios.post('panel/api/statistics/deleteStats');
                    if (res.data.success) {
                        this.$message.success(res.data.msg || '{{ i18n "pages.statistics.toasts.deleteStatsSuccess" }}');
                        this.stopLiveUpdates();
                        window.setTimeout(() => {
                            window.location.reload();
                        }, 5000);
                    } else {
                        this.$message.error(res.data.msg || 'Failed to delete statistics');
                    }
                } catch (e) {
                    this.$message.error('Failed to delete statistics');
                } finally {
                    this.loading = false;
                }
            },
            refreshStatsLive() {
                if (this.loading) {
                    return;
                }
                this.fetchStats();
            },
            startLiveUpdates() {
                this.stopLiveUpdates();

                this.refreshIntervalId = window.setInterval(() => {
                    this.refreshStatsLive();
                }, 10000);

                if (!window.wsClient) {
                    return;
                }

                this.trafficListener = () => {
                    this.refreshStatsLive();
                };
                this.connectListener = () => {
                    this.refreshStatsLive();
                };

                window.wsClient.on('traffic', this.trafficListener);
                window.wsClient.on('connected', this.connectListener);
                window.wsClient.connect();
            },
            stopLiveUpdates() {
                if (this.refreshIntervalId) {
                    clearInterval(this.refreshIntervalId);
                    this.refreshIntervalId = null;
                }

                if (!window.wsClient) {
                    return;
                }

                if (this.trafficListener) {
                    window.wsClient.off('traffic', this.trafficListener);
                    this.trafficListener = null;
                }
                if (this.connectListener) {
                    window.wsClient.off('connected', this.connectListener);
                    this.connectListener = null;
                }
            },
        },
        async mounted() {
            await Promise.all([
                this.fetchStats(),
                this.fetchAutoDeleteConfig(),
            ]);
            this.startLiveUpdates();
        },
        beforeDestroy() {
            this.stopLiveUpdates();
        },
    });
</script>
{{ template "page/body_end" .}}
